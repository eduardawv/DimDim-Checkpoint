# =================================================================
# DimDim CP5 - GitHub Actions - CI/CD para Azure Web App
# Faz build do JAR e deploy automatico no Azure Web App
# =================================================================

name: Build and Deploy to Azure Web App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: rm564434-dimdim-webapp
  JAVA_VERSION: '17'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout do codigo
    - name: Checkout do repositorio
      uses: actions/checkout@v4

    # 2. Configurar Java 17
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        cache: 'maven'

    # 3. Build com Maven
    - name: Build com Maven
      run: |
        chmod +x mvnw 2>/dev/null || true
        ./mvnw clean package -DskipTests -B --no-transfer-progress

    # 4. Login no Azure
    - name: Login Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # 5. Deploy no Web App
    - name: Deploy para Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: target/*.jar
