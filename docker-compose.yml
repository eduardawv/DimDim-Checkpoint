version: "3.9"

services:
  mysql-db:
    image: mysql:8.0
    container_name: dimdim-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: DimDimRoot@2024
      MYSQL_DATABASE: dimdimdb
      MYSQL_USER: dimdim_user
      MYSQL_PASSWORD: DimDim@Pass123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pDimDimRoot@2024"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  dimdim-app:
    build: .
    container_name: dimdim-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-db:3306/dimdimdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: dimdim_user
      SPRING_DATASOURCE_PASSWORD: DimDim@Pass123
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      mysql-db:
        condition: service_healthy

volumes:
  mysql_data:
    name: dimdim_mysql_data
