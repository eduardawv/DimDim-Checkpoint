apiVersion: "2021-10-01"
name: rm564434-dimdim-group
location: eastus
type: Microsoft.ContainerInstance/containerGroups
properties:
  restartPolicy: Always
  osType: Linux
  ipAddress:
    type: Public
    dnsNameLabel: rm564434-dimdim
    ports:
      - protocol: tcp
        port: 8080
  imageRegistryCredentials:
    - server: __ACR_SERVER__
      username: __ACR_USER__
      password: __ACR_PASS__
  containers:
    - name: rm564434-db
      properties:
        image: __ACR_SERVER__/mysql:8.0
        resources:
          requests:
            cpu: 0.5
            memoryInGB: 1.0
        environmentVariables:
          - name: MYSQL_ROOT_PASSWORD
            secureValue: DimDimRoot@2024
          - name: MYSQL_DATABASE
            value: dimdimdb
          - name: MYSQL_USER
            value: dimdim_user
          - name: MYSQL_PASSWORD
            secureValue: DimDim@Pass123
        ports:
          - port: 3306
            protocol: TCP
        volumeMounts:
          - name: mysql-data
            mountPath: /var/lib/mysql
    - name: rm564434-app
      properties:
        image: __ACR_SERVER__/rm564434-dimdim-app:latest
        resources:
          requests:
            cpu: 0.5
            memoryInGB: 1.0
        environmentVariables:
          - name: SPRING_PROFILES_ACTIVE
            value: prod
          - name: SPRING_DATASOURCE_URL
            value: "jdbc:mysql://localhost:3306/dimdimdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
          - name: SPRING_DATASOURCE_USERNAME
            value: dimdim_user
          - name: SPRING_DATASOURCE_PASSWORD
            secureValue: DimDim@Pass123
          - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
            value: com.mysql.cj.jdbc.Driver
          - name: SPRING_JPA_DATABASE_PLATFORM
            value: org.hibernate.dialect.MySQLDialect
          - name: SPRING_JPA_HIBERNATE_DDL_AUTO
            value: update
        ports:
          - port: 8080
            protocol: TCP
  volumes:
    - name: mysql-data
      azureFile:
        shareName: rm564434-dbdata
        storageAccountName: __STORAGE_ACCOUNT__
        storageAccountKey: __STORAGE_KEY__
