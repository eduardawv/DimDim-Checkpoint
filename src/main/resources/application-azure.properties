# =================================================================
# DimDim CP5 - application-azure.properties
# Perfil: azure (ativado via App Settings do Web App)
# Banco: Azure SQL Database (PaaS)
# ATENCAO: Coloque em src/main/resources/
# As credenciais reais ficam nas App Settings do Web App (nao aqui)
# =================================================================

# ── Datasource Azure SQL ──────────────────────────────────────
# Valores padrao para desenvolvimento local.
# Em producao, as App Settings do Azure Web App sobrescrevem estas.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;database=dimdimdb;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Servidor ──────────────────────────────────────────────────
server.port=8080

# ── Swagger / Springdoc ───────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true

# ── Log ───────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.br.com.fiap=DEBUG
