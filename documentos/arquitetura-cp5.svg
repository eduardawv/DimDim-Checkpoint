  <line x1="620" y1="757" x2="658" y2="757" stroke="#3949AB" stroke-width="2" marker-end="url(#arrIndigo)"/>
  <text x="626" y="750" font-size="11" fill="#3949AB">1:N</text>
  <path d="M715 774 v12 h-135 v12" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="722" y="792" font-size="11" fill="#64748B">1:N</text>
  <text x="500" y="860" font-size="12" fill="#475569">CRUD demonstrado: tb_tutor e tb_pet (FK tutor_id, ON DELETE CASCADE)</text>
  <text x="500" y="880" font-size="12" fill="#475569">Migrations versionadas em flyway_schema_history</text>

  <!-- App Settings -->
  <g filter="url(#sh)"><rect x="1015" y="215" width="505" height="215" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.6"/></g>
  <use href="#i-key" x="1032" y="230"/>
  <text x="1094" y="252" font-size="17" font-weight="800" fill="#92400E">App Settings do Web App</text>
  <text x="1094" y="274" font-size="13" fill="#B45309">variáveis de ambiente · segredos fora do código</text>
  <g font-family="DejaVu Sans Mono, monospace" font-size="12.5" fill="#78350F">
    <text x="1036" y="310">SPRING_PROFILES_ACTIVE=azure</text>
    <text x="1036" y="332">SPRING_DATASOURCE_URL / USERNAME / PASSWORD</text>
    <text x="1036" y="354">APPLICATIONINSIGHTS_CONNECTION_STRING</text>
    <text x="1036" y="376">ApplicationInsightsAgent_EXTENSION_VERSION=~3</text>
  </g>
  <text x="1036" y="410" font-size="12" fill="#92400E">Senha do banco digitada no setup (oculta) — nunca vai para o GitHub</text>

  <!-- Application Insights -->
  <g filter="url(#sh)"><rect x="1015" y="470" width="505" height="200" rx="14" fill="#F5EEF8" stroke="#8E44AD" stroke-width="1.6"/></g>
  <use href="#i-insights" x="1032" y="484"/>
  <text x="1094" y="506" font-size="17" font-weight="800" fill="#5B2C6F">Application Insights</text>
  <text x="1094" y="528" font-size="13" fill="#7D3C98">rm564434-dimdim-insights · agente Java (codeless)</text>
  <text x="1036" y="564" font-size="13" fill="#4A235A">• Live Metrics: requisições em tempo real</text>
  <text x="1036" y="586" font-size="13" fill="#4A235A">• Application Map: Web App → Azure SQL</text>
  <text x="1036" y="608" font-size="13" fill="#4A235A">• Performance, Falhas e dependências SQL</text>
  <text x="1036" y="630" font-size="13" fill="#4A235A">• Logs (KQL): requests, dependencies, exceptions</text>

