  <rect width="1600" height="1000" fill="#F8FAFC"/>

  <!-- ===== Titulo ===== -->
  <text x="40" y="52" font-size="28" font-weight="800" fill="#0F172A">CLYVO Predict · CP5 — Arquitetura em nuvem (Azure PaaS)</text>
  <text x="40" y="82" font-size="15" fill="#475569">Java 21 + Spring Boot 3.5 no Azure Web App · Azure SQL Database · Application Insights · deploy por Azure CLI (az webapp deploy)</text>

  <!-- ===== Coluna esquerda: atores externos ===== -->
  <g filter="url(#sh)">
    <rect x="40" y="130" width="290" height="150" rx="14" fill="#fff" stroke="#CBD5E1"/>
    <rect x="40" y="320" width="290" height="125" rx="14" fill="#fff" stroke="#CBD5E1"/>
    <rect x="40" y="490" width="290" height="125" rx="14" fill="#fff" stroke="#CBD5E1"/>
    <rect x="40" y="680" width="290" height="140" rx="14" fill="#fff" stroke="#CBD5E1"/>
  </g>
  <use href="#i-laptop" x="56" y="146"/>
  <text x="116" y="168" font-size="16" font-weight="700" fill="#0F172A">Equipe (Windows)</text>
  <text x="116" y="190" font-size="13" fill="#475569">Git Bash + Azure CLI</text>
  <text x="58" y="222" font-size="13" fill="#334155">• scripts/azure-setup.sh</text>
  <text x="58" y="242" font-size="13" fill="#334155">• Maven: build do JAR (Java 21)</text>
  <text x="58" y="262" font-size="13" fill="#334155">• scripts/azure-destroy.sh</text>

  <use href="#i-github" x="56" y="336"/>
  <text x="116" y="358" font-size="16" font-weight="700" fill="#0F172A">Repositório GitHub</text>
  <text x="116" y="380" font-size="13" fill="#475569">fonte da verdade</text>
  <text x="58" y="410" font-size="13" fill="#334155">• código Java · scripts CLI · DDL</text>
  <text x="58" y="430" font-size="13" fill="#334155">• JSON das operações · README</text>

  <use href="#i-user" x="56" y="506"/>
  <text x="116" y="528" font-size="16" font-weight="700" fill="#0F172A">Usuário / Avaliador</text>
  <text x="116" y="550" font-size="13" fill="#475569">Swagger UI · curl</text>
  <text x="58" y="580" font-size="13" fill="#334155">• scripts/crud-demo.sh</text>
  <text x="58" y="600" font-size="13" fill="#334155">• login → token JWT → CRUD</text>

  <use href="#i-dbterm" x="56" y="696"/>
  <text x="116" y="718" font-size="16" font-weight="700" fill="#0F172A">Terminal do banco</text>
  <text x="116" y="740" font-size="13" fill="#475569">exclusivo para consultas</text>
  <text x="58" y="770" font-size="13" fill="#334155">• scripts/db-terminal.sh (sqlcmd)</text>
  <text x="58" y="790" font-size="13" fill="#334155">• IPv4 da equipe liberado</text>
  <text x="68" y="810" font-size="13" fill="#334155">no firewall do SQL</text>

