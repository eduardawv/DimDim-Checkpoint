  <text x="790" y="196" font-size="13" fill="#0369A1">região principal: Mexico Central</text>

  <!-- App Service Plan + Web App -->
  <rect x="455" y="215" width="500" height="320" rx="14" fill="#E3F2FD" stroke="#64B5F6"/>
  <use href="#i-plan" x="470" y="226" transform="translate(470 226) scale(0.62) translate(-470 -226)"/>
  <text x="508" y="248" font-size="14" font-weight="700" fill="#0D47A1">App Service Plan · rm564434-dimdim-plan · B1 Linux</text>
  <g filter="url(#sh)"><rect x="480" y="268" width="450" height="248" rx="12" fill="#fff" stroke="#1565C0" stroke-width="1.6"/></g>
  <use href="#i-webapp" x="498" y="284"/>
  <text x="560" y="304" font-size="17" font-weight="800" fill="#0D47A1">Azure Web App</text>
  <text x="560" y="326" font-size="13" fill="#1E3A8A">rm564434-dimdim-webapp.azurewebsites.net</text>
  <text x="500" y="362" font-size="13" fill="#1F2937">• Java 21 · Spring Boot 3.5 · API REST (tutores, pets, eventos)</text>
  <text x="500" y="384" font-size="13" fill="#1F2937">• Spring Security · JWT (RSA) · senhas com BCrypt</text>
  <text x="500" y="406" font-size="13" fill="#1F2937">• Flyway: cria as tabelas (T-SQL) no start</text>
  <text x="500" y="428" font-size="13" fill="#1F2937">• HTTPS obrigatório · TLS 1.2 · FTP desligado · Always On</text>
  <text x="500" y="450" font-size="13" fill="#1F2937">• Swagger: /swagger-ui.html</text>
  <text x="500" y="472" font-size="13" fill="#1F2937">• Perfil Spring "azure" (application-azure.properties)</text>
  <text x="500" y="500" font-size="12" fill="#64748B">Deploy: az webapp deploy --type jar</text>

  <!-- SQL Server + DB -->
  <rect x="455" y="590" width="500" height="340" rx="14" fill="#E8EAF6" stroke="#7986CB"/>
  <use href="#i-sqlserver" x="470" y="600" transform="translate(470 600) scale(0.62) translate(-470 -600)"/>
