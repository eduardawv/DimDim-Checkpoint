  <text x="1094" y="780" font-size="13" fill="#1565C0">rm564434-dimdim-logs · retenção 30 dias</text>
  <text x="1036" y="820" font-size="13" fill="#1E3A8A">Armazena a telemetria do Application Insights</text>

