  <text x="458" y="148" font-size="17" font-weight="800" fill="#0C4A6E">Microsoft Azure</text>
  <text x="610" y="148" font-size="13" fill="#0C4A6E">assinatura FIAP · regiões permitidas pela policy (fallback automático no script)</text>

  <rect x="425" y="165" width="1120" height="785" rx="16" fill="#FFFFFF" fill-opacity="0.55" stroke="#0078D4" stroke-width="1.6" stroke-dasharray="7 6"/>
