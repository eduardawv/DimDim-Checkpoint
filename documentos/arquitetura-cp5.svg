  <g font-size="13" font-weight="700">
    <rect x="500" y="740" width="120" height="34" rx="8" fill="#E8EAF6" stroke="#3949AB"/><text x="560" y="762" text-anchor="middle" fill="#1A237E">tb_tutor</text>
    <rect x="660" y="740" width="110" height="34" rx="8" fill="#E8EAF6" stroke="#3949AB"/><text x="715" y="762" text-anchor="middle" fill="#1A237E">tb_pet</text>
    <rect x="500" y="800" width="160" height="34" rx="8" fill="#F1F5F9" stroke="#94A3B8"/><text x="580" y="822" text-anchor="middle" fill="#334155">tb_evento_saude</text>
    <rect x="690" y="800" width="160" height="34" rx="8" fill="#F1F5F9" stroke="#94A3B8"/><text x="770" y="822" text-anchor="middle" fill="#334155">tb_veterinario</text>
